<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7ae5"/>
      <stop offset="0.55" stop-color="#1857c4"/>
      <stop offset="1" stop-color="#0c3fa8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2e9e34"/>
      <stop offset="1" stop-color="#7ec93f"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f86ea"/>
      <stop offset="1" stop-color="#1c53bd"/>
    </linearGradient>
  </defs>

  <!-- green leaf behind the cross -->
  <path d="M150 150 C 205 140 232 96 236 44 C 190 52 156 92 150 150 Z" fill="url(#green)"/>
  <path d="M156 138 C 190 116 214 82 231 52" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>

  <!-- medical cross -->
  <g fill="url(#blue)">
    <rect x="96" y="34" width="64" height="188" rx="18"/>
    <rect x="34" y="96" width="188" height="64" rx="18"/>
  </g>

  <!-- heartbeat / ECG line across the cross -->
  <polyline points="44,132 96,132 112,132 122,150 138,96 152,168 166,120 178,132 224,132"
    fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stethoscope -->
  <path d="M78 70 C 66 120 70 170 118 196 C 176 226 210 196 210 150"
    fill="none" stroke="url(#tube)" stroke-width="13" stroke-linecap="round"/>
  <path d="M78 70 C 74 58 70 52 62 48 M78 70 C 82 58 86 52 94 48"
    fill="none" stroke="url(#tube)" stroke-width="11" stroke-linecap="round"/>
  <circle cx="210" cy="150" r="9" fill="#1857c4"/>

  <!-- chestpiece -->
  <circle cx="200" cy="196" r="30" fill="url(#tube)"/>
  <circle cx="200" cy="196" r="19" fill="#bcd8ff"/>
  <circle cx="200" cy="196" r="8" fill="#0c3fa8"/>
</svg>
