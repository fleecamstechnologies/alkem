services:
  mysql:
    image: mysql:8.0
    container_name: alkem-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alkem_portal
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: alkem
      MYSQL_PASSWORD: alkempassword
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
