services:
  mysql:
    image: mysql:8.0
    container_name: alkem-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alkem_portal
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: alkem
      MYSQL_PASSWORD: alkempassword
    ports:
      - "3309:3306"
    command:
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=1G
      - --innodb-flush-log-at-trx-commit=2
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
