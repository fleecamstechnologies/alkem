# Rendered by scripts/vps/bootstrap.sh -> /etc/nginx/sites-available/alkem-hrms
# Placeholders (__DOMAIN__ etc.) are substituted at install time.

upstream alkem_hrms_api {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __SERVER_IP__;

    root __FRONTEND_ROOT__;
    index index.html;

    client_max_body_size 512M;          # bulk CSV/XLSX imports

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://alkem_hrms_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_buffering      off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# After `certbot --nginx -d __DOMAIN__` a matching `listen 443 ssl` server block
# is added automatically and port 80 is switched to a redirect.
