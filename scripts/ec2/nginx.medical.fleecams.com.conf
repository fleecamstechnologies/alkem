# /etc/nginx/sites-available/medical.fleecams.com
# ln -s ../sites-available/medical.fleecams.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# TLS: obtain certs first with
#   sudo certbot --nginx -d medical.fleecams.com
# (certbot will rewrite the listen 80 block to redirect to 443).

upstream alkem_hrms_api {
    server 127.0.0.1:3005;   # matches PORT in /opt/alkem-hrms/shared/backend.env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name medical.fleecams.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medical.fleecams.com;

    ssl_certificate     /etc/letsencrypt/live/medical.fleecams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medical.fleecams.com/privkey.pem;

    root /opt/alkem-hrms/current/frontend/dist;
    index index.html;

    # bulk CSV/XLSX imports go up to 512 MB (see imports.controller MAX_BYTES)
    client_max_body_size 512M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API — the backend already namespaces every route under /api
    location /api/ {
        proxy_pass http://alkem_hrms_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout   600s;   # long imports
        proxy_send_timeout   600s;
        proxy_buffering      off;
    }

    # hashed Vite assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
